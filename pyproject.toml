[tool.ruff]
line-length = 100
target-version = "py312"   # минимальная версия, на которой должен жить бот (ubuntu 24.04)

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # сортировка импортов
    "B",             # типичные баги (bugbear)
    "UP",            # устаревший синтаксис
    "SIM",           # упрощения
    "RET",           # проблемы с return
    "BLE", "DTZ",    # голые except и datetime без tz
]
ignore = ["BLE001", "DTZ005"]

[tool.ruff.lint.isort]
# иначе ruff может принять bot/pipeline/sources за сторонние пакеты
known-first-party = ["bot", "pipeline", "sources"]
